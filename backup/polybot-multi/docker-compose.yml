version: "3.9"

# ══════════════════════════════════════════════════════════════
# POLYBOT MULTI-BOT
# - 5 SIM bots  (ports 8001-8005 internal)
# - 2 REAL bots (ports 8006-8007 internal, disabled by default)
# - 1 shared dashboard (port 3001)
# - 1 nginx router (port 3001 → routes /bot1/ /bot2/ etc)
# - Shared SQLite volume for cross-bot logs
#
# Usage:
#   Run all sim bots:     docker compose --profile sim up -d
#   Run specific bot:     docker compose up sim1 -d
#   Run real bots:        docker compose --profile real up -d
#   View all logs:        docker compose logs -f
#   Stop all:             docker compose down
# ══════════════════════════════════════════════════════════════

x-bot-base: &bot-base
  build:
    context: ./backend
  restart: unless-stopped
  volumes:
    - shared_data:/app/data
  networks:
    - polynet
  healthcheck:
    test: ["CMD","curl","-f","http://localhost:8000/health"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 15s

services:

  # ── SIM BOT 1 ──────────────────────────────────────────────
  sim1:
    <<: *bot-base
    container_name: polybot-sim1
    env_file: envs/sim1.env
    profiles: [sim, sim1]

  # ── SIM BOT 2 ──────────────────────────────────────────────
  sim2:
    <<: *bot-base
    container_name: polybot-sim2
    env_file: envs/sim2.env
    profiles: [sim, sim2]

  # ── SIM BOT 3 ──────────────────────────────────────────────
  sim3:
    <<: *bot-base
    container_name: polybot-sim3
    env_file: envs/sim3.env
    profiles: [sim, sim3]

  # ── SIM BOT 4 ──────────────────────────────────────────────
  sim4:
    <<: *bot-base
    container_name: polybot-sim4
    env_file: envs/sim4.env
    profiles: [sim, sim4]

  # ── SIM BOT 5 ──────────────────────────────────────────────
  sim5:
    <<: *bot-base
    container_name: polybot-sim5
    env_file: envs/sim5.env
    profiles: [sim, sim5]

  # ── REAL BOT 1 (disabled by default) ───────────────────────
  real1:
    <<: *bot-base
    container_name: polybot-real1
    env_file: envs/real1.env
    profiles: [real, real1]

  # ── REAL BOT 2 (disabled by default) ───────────────────────
  real2:
    <<: *bot-base
    container_name: polybot-real2
    env_file: envs/real2.env
    profiles: [real, real2]

  # ── DASHBOARD (shared, always on) ─────────────────────────
  dashboard:
    build:
      context: ./frontend
    container_name: polybot-dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - polynet

volumes:
  shared_data:    # shared DB + state for all bots

networks:
  polynet:
    driver: bridge
