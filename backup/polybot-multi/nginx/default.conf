server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Default SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Static assets
    location ~* \.(js|css|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API / WS proxy per bot ──────────────────────────────
    # SIM bots
    location /sim1/ {
        proxy_pass         http://sim1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }
    location /sim2/ {
        proxy_pass         http://sim2:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }
    location /sim3/ {
        proxy_pass         http://sim3:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }
    location /sim4/ {
        proxy_pass         http://sim4:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }
    location /sim5/ {
        proxy_pass         http://sim5:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # REAL bots (disabled - only sim profile active)
    # Uncomment these blocks when running real bots
    # location /real1/ {
    #     proxy_pass         http://real1:8000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade $http_upgrade;
    #     proxy_set_header   Connection "Upgrade";
    #     proxy_set_header   Host $host;
    #     proxy_read_timeout 86400s;
    # }
    # location /real2/ {
    #     proxy_pass         http://real2:8000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade $http_upgrade;
    #     proxy_set_header   Connection "Upgrade";
    #     proxy_set_header   Host $host;
    #     proxy_read_timeout 86400s;
    # }

    # DB API (reads from shared SQLite — routed to sim1 as proxy)
    location /api/db/ {
        proxy_pass http://sim1:8000/api/db/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
