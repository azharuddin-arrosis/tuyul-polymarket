### Konfigurasi bot market making Polymarket (BTC Up/Down 5m)
### Copy jadi `config.toml` lalu edit.

[bot]
# Prefix slug untuk market 5m ini:
# contoh slug: btc-updown-5m-1776324000
slug_prefix = "btc-updown-5m-"

# Loop utama (detik)
tick_interval_secs = 1

# Kapan mulai flatten inventory menjelang close
flatten_start_secs = 15

# Kapan mulai lebarin spread & kecilin size
soften_start_secs = 45

[quote]
# Edge dasar (dalam "probability price", 0.01 = 1 cent)
edge_base = 0.012

# Tambahan edge berbasis volatilitas midpoint (estimasi kasar)
edge_k_vol = 4.0

# Tambahan edge saat makin dekat close (kecilkan exposure)
edge_k_time = 0.08

# Threshold untuk cancel/replace (hindari spam)
reprice_threshold = 0.004

# Ukuran order per sisi (dalam USDC notionals)
order_size_usdc = 5.0

# Maks level per sisi (1-2 dulu untuk modal kecil)
max_levels = 1

[risk]
# Maks nilai inventory yang boleh kebawa (USDC). Di atas ini bot akan skew agresif.
max_inventory_usdc = 50.0

# Stop harian (persen bankroll). Untuk modal kecil, 2%/hari.
daily_loss_limit_pct = 2.0

[sim]
# Mode simulasi forward-test:
# - input saldo USDC + POL
# - estimasi gas per aksi (dibikin configurable karena tiap setup bisa beda)
starting_usdc = 10.0
starting_pol = 0.05

# Estimasi biaya gas (dalam POL) per aksi. Default konservatif (silakan tuning).
gas_per_fill_pol = 0.00015
gas_per_cancel_pol = 0.00005

# Fee trading (dalam bps dari notional). Kalau market fees berubah, ubah ini.
# Catatan: di Polymarket beberapa fee bersifat taker-only; untuk simulasi awal kita pakai maker fee kecil.
maker_fee_bps = 0
taker_fee_bps = 20

[compound]
# Aturan bet sizing bertingkat (contoh sesuai permintaan kamu):
# - modal < 25 => bet $1
# - modal >=25 => bet $2
tier1_cap_usdc = 25.0
tier1_bet_usdc = 1.0
tier2_cap_usdc = 50.0
tier2_bet_usdc = 2.0

# Aturan "panen": setiap kali equity mencapai 2x modal saat ini,
# kita withdraw 50% profit, dan 50% profit ditambah ke modal (compounding).
harvest_on_2x = true
withdraw_profit_share = 0.5

[endpoints]
gamma_http = "https://gamma-api.polymarket.com"
clob_http = "https://clob.polymarket.com"
clob_ws_market = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
