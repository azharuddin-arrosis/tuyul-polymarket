services:
  polymarket-sim:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-sim
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - STARTING_CAPITAL=1000
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s