[package]
name = "compound-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Server (Older versions for compatibility)
axum = "0.6.20"
tokio = { version = "1.28", features = ["full"] }
tower-http = { version = "0.4", features = ["fs", "cors"] }

# Data & Logic
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
colored = "2"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.8"
