[package]
name = "polybot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "farm_bot"
path = "src/main.rs"

[[bin]]
name = "real_bot"
path = "src/real_bot.rs"

[[bin]]
name = "btc5m_dashboard"
path = "btc5m_dashboard.rs"

[[bin]]
name = "data_fetcher"
path = "data_fetcher.rs"

[dependencies]
# Web Server
axum = "0.6.20"
tokio = { version = "1.28", features = ["full"] }
tower-http = { version = "0.4", features = ["fs", "cors"] }

# API & Security
reqwest = { version = "0.11", features = ["json", "blocking"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
dotenv = "0.15"
hex = "0.4"

# Data & Logic
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
rand = "0.8"
rayon = "1.8"
