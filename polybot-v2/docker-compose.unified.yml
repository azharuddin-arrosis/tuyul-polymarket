# Unified Dashboard Docker Compose
# Runs Bot 1, Bot 2, and Unified Dashboard together

services:
  # ═══════════════════════════════════════════════════════════════
  # BOT 1 — Primary Trading Bot
  # ═══════════════════════════════════════════════════════════════
  bot1:
    build:
      context: ./backend
    container_name: polybot-bot1
    restart: unless-stopped
    env_file: .env.bot1
    environment:
      - BOT_NAME=bot1
      - BOT_DISPLAY_NAME=Bot 1
      - BOT_COLOR=#00ff88
      - BOT_API_PORT=8001
    volumes:
      - bot1_data:/app/data
      - bot1_logs:/app/logs
    networks:
      - polybot_net
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════
  # BOT 2 — Secondary Trading Bot
  # ═══════════════════════════════════════════════════════════════
  bot2:
    build:
      context: ./backend
    container_name: polybot-bot2
    restart: unless-stopped
    env_file: .env.bot2
    environment:
      - BOT_NAME=bot2
      - BOT_DISPLAY_NAME=Bot 2
      - BOT_COLOR=#3a8fd8
      - BOT_API_PORT=8002
    volumes:
      - bot2_data:/app/data
      - bot2_logs:/app/logs
    networks:
      - polybot_net
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════
  # UNIFIED DASHBOARD — Single UI for both bots
  # ═══════════════════════════════════════════════════════════════
  dashboard:
    build:
      context: ./frontend
    container_name: polybot-unified-dashboard
    restart: unless-stopped
    environment:
      - BOT1_API_URL=http://bot1:8000
      - BOT2_API_URL=http://bot2:8000
      - UNIFIED_MODE=true
    depends_on:
      bot1:
        condition: service_healthy
      bot2:
        condition: service_healthy
    networks:
      - polybot_net
    ports:
      - "3000:3001"

volumes:
  bot1_data:
  bot1_logs:
  bot2_data:
  bot2_logs:

networks:
  polybot_net:
    driver: bridge