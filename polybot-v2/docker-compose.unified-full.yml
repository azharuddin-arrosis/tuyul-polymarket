# ============================================================
# PolyBot v2 - Unified Docker Compose
# Deploy: 2 Bots + 1 Frontend Dashboard
# Usage: docker compose up -d
# ============================================================

services:
# ═══════════════════════════════════════════════════════════════
# BOT 1 - First Trading Bot Instance
# ═══════════════════════════════════════════════════════════════
  bot1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polybot-v2-bot1
    restart: unless-stopped
    env_file: .env.bot1
    environment:
      - BOT_NAME=bot1
      - BOT_PORT=8001
      - BOT_MODE=${BOT_MODE:-sim}
      - LOG_LEVEL=INFO
    ports:
      - "8001:8000"
    volumes:
      - bot1_data:/app/data
      - bot1_logs:/app/logs
    networks:
      - polybot_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

# ═══════════════════════════════════════════════════════════════
# BOT 2 - Second Trading Bot Instance
# ═══════════════════════════════════════════════════════════════
  bot2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polybot-v2-bot2
    restart: unless-stopped
    env_file: .env.bot2
    environment:
      - BOT_NAME=bot2
      - BOT_PORT=8002
      - BOT_MODE=${BOT_MODE:-sim}
      - LOG_LEVEL=INFO
    ports:
      - "8002:8000"
    volumes:
      - bot2_data:/app/data
      - bot2_logs:/app/logs
    networks:
      - polybot_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

# ═══════════════════════════════════════════════════════════════
# FRONTEND - Unified Dashboard
# ═══════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polybot-v2-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      bot1:
        condition: service_healthy
      bot2:
        condition: service_healthy
    networks:
      - polybot_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ═══════════════════════════════════════════════════════════════
# Named Volumes (persistent data per bot)
# ════════════════════════════════════════��══════════════════════
volumes:
  bot1_data:
    name: polybot-v2-bot1-data
  bot2_data:
    name: polybot-v2-bot2-data
  bot1_logs:
    name: polybot-v2-bot1-logs
  bot2_logs:
    name: polybot-v2-bot2-logs

# ═══════════════════════════════════════════════════════════════
# Network Configuration
# ═══════════════════════════════════════════════════════════════
networks:
  polybot_net:
    name: polybot-v2-net
    driver: bridge