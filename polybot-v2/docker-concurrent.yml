# POLYMARKET BOT v2 — CONCURRENT DEPLOYMENT (SIM + REAL)
# Deploys multiple bot instances running simultaneously in both simulator
# and real mode.

services:
  # SIMULATOR MODE BOTS
  bot1-sim:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polybot-bot1-sim
    restart: unless-stopped
    env_file: .env.bot1
    environment:
      - BOT_NAME=bot1-sim
      - BOT_MODE=sim
      - BOT_PORT=8001
      - BOTS=bot1,bot2
    volumes:
      - bot1-sim_data:/app/data
      - bot1-sim_logs:/app/logs
    networks:
      - polybot_net
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - sim
      - bot1-sim
      - all

  bot2-sim:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polybot-bot2-sim
    restart: unless-stopped
    env_file: .env.bot2
    environment:
      - BOT_NAME=bot2-sim
      - BOT_MODE=sim
      - BOT_PORT=8002
      - BOTS=bot1,bot2
    volumes:
      - bot2-sim_data:/app/data
      - bot2-sim_logs:/app/logs
    networks:
      - polybot_net
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - sim
      - bot2-sim
      - all

  # REAL MODE BOTS
  bot1-real:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polybot-bot1-real
    restart: unless-stopped
    env_file: .env.bot1-real
    environment:
      - BOT_NAME=bot1-real
      - BOT_MODE=real
      - BOT_PORT=8011
      - BOTS=bot1,bot2
    volumes:
      - bot1-real_data:/app/data
      - bot1-real_logs:/app/logs
    networks:
      - polybot_net
    ports:
      - "8011:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - real
      - bot1-real
      - all

  bot2-real:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polybot-bot2-real
    restart: unless-stopped
    env_file: .env.bot2-real
    environment:
      - BOT_NAME=bot2-real
      - BOT_MODE=real
      - BOT_PORT=8012
      - BOTS=bot1,bot2
    volumes:
      - bot2-real_data:/app/data
      - bot2-real_logs:/app/logs
    networks:
      - polybot_net
    ports:
      - "8012:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - real
      - bot2-real
      - all

  # DASHBOARD - Simulator Mode
  dashboard-sim:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polybot-dashboard-sim
    restart: unless-stopped
    environment:
      - REACT_APP_WS_URL=ws://bot1-sim:8000/ws
      - REACT_APP_API_URL=http://bot1-sim:8000/api
      - REACT_APP_BOT_NAME=Simulator Bots
      - PORT=3001
      - BACKEND_HOST=bot1-sim
      - BACKEND_PORT=8000
    networks:
      - polybot_net
    ports:
      - "3001:3001"
    depends_on:
      bot1-sim:
        condition: service_healthy
      bot2-sim:
        condition: service_healthy
    profiles:
      - sim
      - all

volumes:
  bot1-sim_data:
    driver: local
  bot1-sim_logs:
    driver: local
  bot2-sim_data:
    driver: local
  bot2-sim_logs:
    driver: local
  bot1-real_data:
    driver: local
  bot1-real_logs:
    driver: local
  bot2-real_data:
    driver: local
  bot2-real_logs:
    driver: local

networks:
  polybot_net:
    driver: bridge
    name: polybot_concurrent_net
