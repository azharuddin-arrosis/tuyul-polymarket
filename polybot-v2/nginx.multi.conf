worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ═══════════════════════════════════════════════════════════════════
    # UPSTREAM BOT SERVERS
    # ═══════════════════════════════════════════════════════════════════
    upstream bot1_backend {
        server bot1:8000;
    }
    
    upstream bot2_backend {
        server bot2:8000;
    }

    # ═══════════════════════════════════════════════════════════════════
    # SERVER CONFIG
    # ═══════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name localhost;

        # ─── HEALTH CHECK ───────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ─── BOT 1 API ─────────────────────────────────────────────
        location /api/bot1/ {
            proxy_pass http://bot1_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── BOT 2 API ─────────────────────────────────────────────
        location /api/bot2/ {
            proxy_pass http://bot2_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── COMBINED API (default to bot1) ─────────────────────────────
        location /api/ {
            proxy_pass http://bot1_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Bot-Name bot1;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── DASHBOARD / ──────────────────────────────────────────
        location / {
            proxy_pass http://frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── DASHBOARD /dashboard/ ────────────────────────────────
        location /dashboard {
            proxy_pass http://frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── DASHBOARD /dashboard/{bot_name} ────────────────────────
        location ~ ^/dashboard/(.+)$ {
            proxy_pass http://frontend:3001/$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Bot-Name $1;
        }

        # ─── WEBSOCKET /ws ─────────────────────────────────────────
        location /ws {
            proxy_pass http://bot1_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # BOT-SPECIFIC SERVER BLOCKS (for direct access)
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 8001;
        server_name localhost;
        
        location / {
            proxy_pass http://bot1_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Bot-Name bot1;
        }
    }

    server {
        listen 8002;
        server_name localhost;
        
        location / {
            proxy_pass http://bot2_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Bot-Name bot2;
        }
    }
}