version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════════
# POLYMARKET BOT v2 — SIMULATION MODE ONLY
# ======================================================================
# Quick start untuk simulation (tanpa database, tanpa nginx)
# Usage: docker-compose up -d
#        docker-compose up -d bot1 bot2
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # BOT 1 — PRIMARY (BTC Scalper)
  # ═══════════════════════════════════════════════════════════════════════════════
  bot1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polybot-bot1
    restart: unless-stopped
    env_file: .env.bot1
    environment:
      - BOT_NAME=bot1
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════════
  # BOT 2 — SECONDARY (Momentum)
  # ═══════════════════════════════════════════════════════════════════════════════
  bot2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polybot-bot2
    restart: unless-stopped
    env_file: .env.bot2
    environment:
      - BOT_NAME=bot2
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3